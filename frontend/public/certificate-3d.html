<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arshi GPS - BW Businessworld Emerging Businesses 2021</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: system-ui, -apple-system, sans-serif;
}
.scene {
  perspective: 1200px;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
}
.card {
  position: relative;
  max-width: 94%;
  max-height: 90%;
  aspect-ratio: 1600 / 1131;
  width: min(92vw, 480px);
  transform-style: preserve-3d;
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s;
  touch-action: none;
  cursor: grab;
  border-radius: 12px;
  background: #ffffff;
  box-shadow: 0 16px 35px -8px rgba(0, 0, 0, 0.18), 0 4px 12px rgba(0, 0, 0, 0.08);
  border: 1px solid rgba(0, 0, 0, 0.08);
}
.card:active, .card.active {
  transition: transform 0.06s linear, box-shadow 0.15s;
  cursor: grabbing;
}
.card img {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 11px;
  -webkit-user-drag: none;
  user-select: none;
  pointer-events: none;
  object-fit: cover;
}
.glare {
  position: absolute;
  inset: 0;
  border-radius: 11px;
  pointer-events: none;
  background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 65%);
  opacity: 0.25;
  transition: opacity 0.3s;
  mix-blend-mode: overlay;
}
.card.active .glare {
  opacity: 0.85;
}
</style>
</head>
<body>
<div class="scene">
  <div class="card" id="card">
    <img
      alt="BW Businessworld Emerging Businesses Award 2021 - Arshi Enterprises"
      src="assets/images/award-bw-businessworld-2021.jpg"
      onerror="if(!this.tried){this.tried=true;this.src='/assets/images/award-bw-businessworld-2021.jpg';}"
      loading="eager"
    />
    <div class="glare"></div>
  </div>
</div>
<script>
(function(){
  var c = document.getElementById('card');
  if(!c) return;
  var g = c.querySelector('.glare');
  var MAX = 16;
  var autoAngle = 0;
  var isInteracting = false;
  
  function move(e) {
    isInteracting = true;
    var r = c.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width;
    var y = (e.clientY - r.top) / r.height;
    x = Math.max(0, Math.min(1, x));
    y = Math.max(0, Math.min(1, y));
    var ry = (x - 0.5) * 2 * MAX;
    var rx = -(y - 0.5) * 2 * MAX;
    c.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) scale3d(1.02, 1.02, 1.02)';
    c.style.boxShadow = (-ry * 1.5) + 'px ' + (20 + rx * 1.5) + 'px 40px rgba(0,0,0,.22)';
    if(g) {
      g.style.setProperty('--gx', (x * 100) + '%');
      g.style.setProperty('--gy', (y * 100) + '%');
    }
  }
  
  function reset() {
    isInteracting = false;
    c.classList.remove('active');
    c.style.transform = '';
    c.style.boxShadow = '';
  }
  
  c.addEventListener('pointerdown', function(e){
    c.classList.add('active');
    try { c.setPointerCapture(e.pointerId); } catch(_){}
    move(e);
  });
  c.addEventListener('pointermove', function(e){
    if(e.pointerType === 'mouse' || c.classList.contains('active')){
      c.classList.add('active');
      move(e);
    }
  });
  c.addEventListener('pointerup', reset);
  c.addEventListener('pointercancel', reset);
  c.addEventListener('pointerleave', function(e){
    if(e.pointerType === 'mouse') reset();
  });

  // Gentle subtle auto float when idle
  function idleFloat() {
    if(!isInteracting && !c.classList.contains('active')) {
      autoAngle += 0.025;
      var idleRx = Math.sin(autoAngle) * 4;
      var idleRy = Math.cos(autoAngle * 0.8) * 6;
      c.style.transform = 'rotateX(' + idleRx + 'deg) rotateY(' + idleRy + 'deg)';
      if(g) {
        var gx = 50 + idleRy * 3;
        var gy = 50 + idleRx * 3;
        g.style.setProperty('--gx', gx + '%');
        g.style.setProperty('--gy', gy + '%');
      }
    }
    requestAnimationFrame(idleFloat);
  }
  idleFloat();
})();
</script>
</body>
</html>
