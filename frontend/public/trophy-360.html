<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>India 5000 Best MSME Awards 2020 - Arshi Enterprises (360° Trophy)</title>
<style>
:root {
  --bg1: #f4f1ea;
  --bg2: #d9d4c7;
  --fg: #3a352b;
  --img: url('assets/images/trophy-360-sprite.webp');
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg1: #2a2a31; --bg2: #101014; --fg: #d8d2c2; }
}
:root[data-theme="dark"] { --bg1: #2a2a31; --bg2: #101014; --fg: #d8d2c2; }
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  background: transparent;
  overflow: hidden;
}
body {
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#stage {
  perspective: 1200px;
  touch-action: none;
  cursor: grab;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  flex: 1;
  min-height: 0;
  transform: translateZ(0);
}
#stage:active { cursor: grabbing; }
#model {
  position: relative;
  transform-style: preserve-3d;
  will-change: transform;
  transform: translateZ(0);
}
.L {
  position: absolute;
  inset: 0;
  background-image: var(--img);
  background-position: center;
  background-size: 100% 100%;
  background-repeat: no-repeat;
  pointer-events: none;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: high-quality;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: translateZ(0);
}
.F, .B { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.M { filter: brightness(.65) saturate(1.05); }
#shadow {
  width: 38vmin;
  height: 2.8vmin;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0,0,0,.22), transparent 70%);
  margin-top: -1.5vmin;
  flex: none;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="stage"><div id="model"></div></div>
<div id="shadow"></div>
<script>
(function(){
  var model = document.getElementById('model');
  var stage = document.getElementById('stage');
  if (!model || !stage) return;

  var RATIO = 1092 / 3200;
  var N = 18; // Optimized layer count for ultra smooth 60fps rendering
  var T = 0.045;
  var layers = [];

  for (var i = 0; i < N; i++) {
    var d = document.createElement('div');
    d.className = 'L ' + (i === 0 ? 'B' : (i === N - 1 ? 'F' : 'M'));
    model.appendChild(d);
    layers.push(d);
  }

  function size() {
    var H = Math.min(stage.clientHeight * 0.90, window.innerWidth * 1.8);
    var W = H * RATIO;
    model.style.width = W + 'px';
    model.style.height = H + 'px';
    var th = H * T;
    for (var i = 0; i < N; i++) {
      var z = (i / (N - 1) - 0.5) * th;
      layers[i].style.transform = (i === 0) ? 'translate3d(0,0,' + z + 'px) rotateY(180deg)' : 'translate3d(0,0,' + z + 'px)';
    }
  }

  size();
  window.addEventListener('resize', size);

  var ry = -25, rx = -6, vy = 0, auto = true, drag = false, lx = 0, ly = 0;

  function draw() {
    model.style.transform = 'translateZ(0) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
  }

  stage.addEventListener('pointerdown', function(e) {
    drag = true;
    lx = e.clientX;
    ly = e.clientY;
    vy = 0;
    try { stage.setPointerCapture(e.pointerId); } catch(_) {}
  });

  stage.addEventListener('pointermove', function(e) {
    if (!drag) return;
    var dx = e.clientX - lx;
    var dy = e.clientY - ly;
    lx = e.clientX;
    ly = e.clientY;
    vy = dx * 0.55;
    ry += vy;
    rx = Math.max(-25, Math.min(25, rx - dy * 0.2));
  });

  function up() { drag = false; }
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);

  function tick() {
    if (!drag) {
      if (Math.abs(vy) > 0.05) {
        ry += vy;
        vy *= 0.95;
      } else if (auto) {
        ry += 0.45;
      }
      rx += (-6 - rx) * 0.02 * (auto ? 1 : 0);
    }
    draw();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
